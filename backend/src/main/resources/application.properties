# ---------------------------------------------------------------
# Smart Event Management and Registration System - backend config
# Every value can be overridden with an environment variable.
# No secrets live here: locally they come from the git-ignored
# backend/config/application.properties (see config.example.properties),
# in production from environment variables (DB_PASSWORD, JWT_SECRET...).
# ---------------------------------------------------------------
spring.application.name=event-system
server.port=${PORT:8080}
# Auth is JWT-only; skip Spring's default in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# MySQL - database and user are created by database/setup.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:eventapp}
spring.datasource.password=${DB_PASSWORD:}
# Free hosted MySQL plans allow few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# JWT
# No default on purpose: the app refuses to start without a signing key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=24

# Public address of the web app (printed in certificate QR codes)
app.public-url=${PUBLIC_URL:http://localhost:5173}

# Frontend origin allowed by CORS
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Seed demo accounts and events on first start
app.seed.enabled=${SEED_ENABLED:true}
# Public deployments should set SEED_PASSWORD so the demo admin is not guessable.
app.seed.password=${SEED_PASSWORD:Demo@1234}

# Email - disabled by default (emails are logged instead).
# To send real mail: set MAIL_ENABLED=true, MAIL_USERNAME=<gmail address>
# and MAIL_PASSWORD=<16-char Gmail app password>.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:no-reply@eventsystem.local}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Reminder emails: checked every hour, sent ~24h before an event
app.reminders.cron=0 0 * * * *
