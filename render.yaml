# Render Blueprint: creates the API and the website from this repo.
# Dashboard -> New -> Blueprint -> pick this repository.
# You will be asked for MONGODB_URI (the connection string of your MongoDB Atlas cluster).
services:
  - type: web
    name: pulse-api
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false # mongodb+srv://USER:PASSWORD@CLUSTER.mongodb.net/pulse?retryWrites=true&w=majority
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true # password of the demo accounts; read it in the dashboard
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: pulse-web
          property: host
      - key: PUBLIC_URL
        fromService:
          type: web
          name: pulse-web
          property: host

  - type: web
    name: pulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: pulse-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
